name: Deploy site to GitHub Pages

on:
  push:
    branches: [main]
  repository_dispatch:
    types: [games-updated]
  workflow_dispatch:
  schedule:
    - cron: '*/15 * * * *'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout site repo
        uses: actions/checkout@v4
        with:
          path: site

      - name: Resolve games main SHA
        id: games
        run: |
          sha="$(git ls-remote https://github.com/CursedOne0u0/local-browser-games.git refs/heads/main | cut -f1)"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "games/main is $sha"

      - name: Prepare cache marker
        run: mkdir -p _cache-games-sha

      - name: Cache check for games SHA
        uses: actions/cache@v4
        id: gcache
        with:
          path: _cache-games-sha
          key: games-main-${{ steps.games.outputs.sha }}

      - name: Skip deploy when games unchanged (scheduled poll)
        if: github.event_name == 'schedule' && steps.gcache.outputs.cache-hit == 'true'
        run: |
          echo "games/main SHA is already the deployed version; nothing to do"
          exit 0

      - name: Checkout games repo
        uses: actions/checkout@v4
        with:
          repository: CursedOne0u0/local-browser-games
          ref: main
          path: site/_site/games

      - name: Assemble site
        working-directory: site
        run: |
          rm -rf _site/games/.git _site/games/.github
          cp src/index.html _site/index.html
          test -f _site/index.html
          test -f _site/games/local-browser-games/1player/breakout-blast/index.html
          test -f _site/games/local-browser-games/hybrid1-2/pong-duo/index.html

      - name: Generate hub cards from game manifests
        working-directory: site
        run: |
          python3 src/build_cards.py _site/games _site/index.html

      - name: Verify every hub link resolves
        working-directory: site
        run: |
          missing=0
          for u in $(grep -oE '(href|src)="games/[^"]*"' _site/index.html | sed -E 's/^(href|src)="//; s/"$//' | sort -u); do
            if [ ! -f "_site/$u" ]; then
              echo "MISSING: $u"
              missing=1
            fi
          done
          test "$missing" -eq 0 || { echo "::error::hub links a file the games repo does not have"; exit 1; }
          echo "all hub links resolve"

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site/_site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4